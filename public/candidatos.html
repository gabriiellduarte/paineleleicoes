<!doctype html><html lang="pt-BR"><head><title>Candidatos · Apuração Aracati</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/app.css">
<style>
.star{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:20px;line-height:1;cursor:pointer}
.star[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.crow{display:grid;grid-template-columns:40px 64px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.crow .sw{height:30px}
.crow small{display:block;color:var(--muted);font-size:12px}
.vg{display:block;width:130px;text-align:right;font:500 14px var(--f-mono);padding:6px 8px}
.vgl{display:block;font:400 10px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;text-align:right}
.crow .v{font:500 14px var(--f-mono);text-align:right}
</style><!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Q5KPR9F449"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-Q5KPR9F449');
</script>
</head>
<body>
<header class="topbar"><select class="sel" id="cargo" aria-label="Cargo"></select></header>
<main>
  <div class="card">
    <div class="card-h"><div><h2>Candidatos</h2><p class="muted" id="resumo"></p></div>
      <div class="chips"><button class="chip on" data-m="todos">Todos</button><button class="chip" data-m="fav">Só favoritos</button><button class="btn" id="limpar" style="padding:5px 12px;font-size:12px">Limpar favoritos</button></div></div>
    <input class="inp" id="busca" placeholder="Buscar por nome, número ou partido…" autocomplete="off">
    <p class="muted" style="font-size:13px">Marque com a estrela quem você quer acompanhar. No dashboard e no telão, o resultado mostra só os favoritos; sem favoritos, os 10 primeiros. Nos favoritos, preencha “Votos gerais” (a votação total do candidato): ela aparece ao lado dos votos de Aracati.</p>
    <div id="lista"></div>
  </div>
</main>
<script type="module">
import * as A from '/app.js';
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search); // filtros vindos do link
let modo = P.get('ver') === 'fav' ? 'fav' : 'todos', busca = P.get('q') || '';
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

function render() {
  const cargo = A.cargoAtual(), res = A.resultado(cargo);
  A.urlEstado({ cargo, ver: modo === 'fav' ? 'fav' : '', q: busca });
  const todos = A.candidatosDe(cargo);
  const votos = new Map(res.rank.map(c => [c.id, c.votos]));
  const nFav = todos.filter(c => c.favorito).length;
  $('resumo').textContent = `${todos.length} candidatos · ${nFav} favorito${nFav === 1 ? '' : 's'}`;
  $('limpar').hidden = !nFav;
  document.querySelectorAll('[data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === modo));
  const b = norm(busca);
  const lista = todos.filter(c => (modo === 'todos' || c.favorito) && (!b || norm(c.nome).includes(b) || c.numero.startsWith(b) || norm(c.partido).includes(b)))
    .sort((x, y) => (y.favorito || 0) - (x.favorito || 0) || x.nome.localeCompare(y.nome, 'pt-BR'));
  $('lista').innerHTML = lista.map(c => `<div class="crow"><button class="star" data-id="${c.id}" aria-pressed="${c.favorito ? 'true' : 'false'}" aria-label="${c.favorito ? 'Remover dos' : 'Adicionar aos'} favoritos: ${A.esc(c.nome)}">${c.favorito ? '★' : '☆'}</button><div class="sw" style="background:${c.cor}">${A.esc(c.numero)}</div><div style="min-width:0"><b>${A.esc(c.nome)}</b><small>${A.esc(c.partido)}${c.vice ? ' · vice ' + A.esc(c.vice) : ''}</small></div><span class="v">${res.apuradas ? A.fmt(votos.get(c.id) || 0) + ' votos' : ''}</span>${c.favorito ? `<label class="vgl">Votos gerais<input class="inp vg" data-vg="${c.id}" inputmode="numeric" placeholder="—" value="${c.votos_gerais ?? ''}"></label>` : '<span></span>'}</div>`).join('')
    || `<div class="empty">${modo === 'fav' ? 'Nenhum favorito neste cargo ainda.' : 'Nenhum candidato encontrado.'}</div>`;
}

async function gravar(id, favorito) {
  await A.pedirLogin();
  try { await A.enviar('POST', '/api/favorito', { id, favorito }); } catch (e) { A.toast(e.message, true); }
}
document.addEventListener('click', async e => {
  const st = e.target.closest('.star');
  if (st) {
    const c = A.D.candidatos.find(x => x.id === Number(st.dataset.id));
    c.favorito = c.favorito ? 0 : 1; render();       // atualiza na hora; o servidor confirma em seguida
    await gravar(c.id, c.favorito);
  }
  const m = e.target.closest('[data-m]'); if (m) { modo = m.dataset.m; render(); }
  if (e.target.id === 'limpar') {
    if (e.target.dataset.sure !== '1') { e.target.dataset.sure = '1'; e.target.textContent = 'Confirmar'; return; }
    e.target.dataset.sure = ''; e.target.textContent = 'Limpar favoritos';
    for (const c of A.candidatosDe(A.cargoAtual()).filter(x => x.favorito)) { c.favorito = 0; await gravar(c.id, 0); }
    render();
  }
});
async function salvarGeral(inp) {
  const id = Number(inp.dataset.vg), c = A.D.candidatos.find(x => x.id === id);
  const v = inp.value.replace(/\D/g, '');
  if ((c.votos_gerais == null ? '' : String(c.votos_gerais)) === v) return;
  await A.pedirLogin();
  try { await A.enviar('POST', '/api/votos-gerais', { id, votos: v }); c.votos_gerais = v === '' ? null : Number(v); A.toast('Votos gerais salvos.'); }
  catch (e) { A.toast(e.message, true); }
}
document.addEventListener('input', e => { if (e.target.dataset?.vg !== undefined) e.target.value = e.target.value.replace(/\D/g, ''); });
document.addEventListener('change', e => { if (e.target.dataset?.vg !== undefined) salvarGeral(e.target); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.dataset?.vg === undefined) return;
  e.preventDefault();
  const todos = [...document.querySelectorAll('.vg')], i = todos.indexOf(e.target);
  salvarGeral(e.target); (todos[i + 1] || e.target).focus();
});
$('busca').oninput = e => { busca = e.target.value; render(); };
await A.iniciar();
A.menu('/candidatos');
$('busca').value = busca;
A.seletorCargo($('cargo'), render);
A.aoMudar(() => { if (!document.activeElement?.matches?.('.vg')) render(); }); render();
</script></body></html>
